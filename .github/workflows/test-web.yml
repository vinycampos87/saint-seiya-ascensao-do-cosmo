name: Testar demo web Saint Seiya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check game.js
          node --check spritefix.js
          node --check tests/smoke.cjs
      - name: Instalar testador Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Subir servidor local
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/ss-server.log 2>&1 &
          sleep 2
      - name: Testar movimento, sprites e enfermaria
        run: node tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-jogo-v061
          path: tests/output/arena.png
          if-no-files-found: ignore
