name: Testar demo web Saint Seiya

on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'spritefix.js'
      - 'game.css'
      - 'epic-ui.css'
      - '.github/workflows/test-web.yml'
  workflow_dispatch:

concurrency:
  group: screenshot-qa-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check game.js
          node --check spritefix.js
          node --check grounded-v062.js
          node --check tests/smoke.cjs
      - name: Instalar testador Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Subir servidor local
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/ss-server.log 2>&1 &
          sleep 2
      - name: Testar movimento, sprites e enfermaria
        run: node tests/smoke.cjs
      - name: Guardar captura de QA
        if: success()
        run: |
          mkdir -p preview
          cp tests/output/arena.jpg preview/arena-v062.jpg
          git config user.name "ss-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/arena-v062.jpg
          if ! git diff --cached --quiet; then
            git commit -m "test: atualizar captura QA v0.6.2"
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-jogo-v062
          path: tests/output/arena.png
          if-no-files-found: ignore
